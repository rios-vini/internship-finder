# CI — Internship Finder
#
# Roda a suite standalone de scripts de teste (scripts/test_*.py) em runner
# limpo (ubuntu-latest, Python 3.12). Os testes sao scripts standalone: imprimem
# `[OK]`/`[FAIL]` e terminam com `TUDO OK` (exit 0) ou FALHAS (exit != 0).
#
# DECISAO item 2 (data/): opcao (a). Em runner limpo nao existe `data/`
# (gitignored). Os scripts test_dedup.py e test_ranking.py foram ajustados (mudanca
# minima) para SKIP o bloco "real" (data/eligible_jobs.json) quando o arquivo esta
# ausente, com mensagem clara e exit 0. Desde o P2 #16 (03/09) o test_ranking roda
# com a FIXTURE fixa (18 jobs sinteticos) no CI e NAO depende de snapshot: o
# bloco real e skipado sem `data/` e nao ha allowlist de falhas conhecidas.
#
# EXCLUSAO: scripts/manifest_probe.py NAO entra na suite do CI. E um probe
# manual (prints, sem assertions) que consulta o manifest externo das
# empresas do ats-scrapers (requisicao de rede a storage.stapply.ai) — em
# runner limpo isso e instavel e nao-deterministico; o probe roda localmente
# (no VPS, com a base acessivel) e segue fora do CI.
#
# EXCLUSAO (limpeza 05/09): test_fetch.py, test_find_company.py e test_resolver.py
# foram REMOVIDOS do repo e do array — eram smokes de rede SEM assertions (prints +
# fetch ao vivo), entraram no CI por engano no PR #21. Rede ao vivo e
# nao-deterministico em runner limpo; a cobertura que eles tocavam e offline
# (test_registry/test_errors) ou runbook (scripts/verify_companies.py).
#
# F1 (01/10): test_f1.py entra na suíte (46º script) — trava os 3 kill
# switches default OFF (enrichment LLM, deadline hydration, official-page)
# com os caminhos preservados sob demanda + invariantes de ranking.
#
# F18 (08/10): test_f18.py entra na suíte (61º script) — trava a correção
# dos 5 falsos negativos do classificador de alemão (MTU x2, Vodafone,
# TRUMPF, Deloitte x2 → required; Airbus "German desirable" continua
# preferred), o regex requires_master (FPs "master data"/"Bachelor's or
# Master's" verificados False) e o hard exclude de aplicabilidade na
# camada eligible (de-required/visa-blocked/tese/ws-puro/mestrado;
# unclear e híbridos FICAM; --no-applicability reversível).
#
# F20 (08/10): test_f20.py entra na suíte (63º script) — trava a higiene
# de dados do topo: dedup espelho BA×EURES (external_id EURES = base64 da
# referência BA; fixtures reais Airbus/Everllence; decode inválido ignora
# gracioso), liveness v2 soft-dead (200 + marcador de vaga encerrada /
# redirect-para-homepage / shell SPA de board → dead_link; 403/429/
# timeout continuam ignorados; falha total = ninguém marcado), hidratação
# top-N (descrição curta + JSON-LD/og:description → description com
# provenance hydrated_topn; falha mantém a original; re-avaliação F18
# german_level/requires_master sobre a hidratada → demovida do top com
# marcador, fica no JSON) e o orçamento de bytes da seção 🎯 (top-15 +
# linha honesta "+X outras"; gate ⭐ da F15 permanece como último
# recurso; PAGE_HARD_CAP_BYTES = 150.000 FICA).
#
# F21 (09/10): test_f21.py entra na suíte (65º script) — trava as fontes
# de pesquisa Tier 1 (adapter direto, NÃO registry): MPG RSS/TU Berlin/
# Leibniz com fixtures verbatim dos probes + APIs keyless (Arbeitnow/
# RemoteOK/freehire) com prefilter F3, fail-soft do estágio, kill switch
# por env var, idempotência, integração CLI (default ON no --registry) e
# dedup cross-fonte MPG×BA pela chave URL — 100% offline (zero HTTP,
# padrão test_f15 T5).
#
# F3 (02/10): test_f3.py entra na suíte (47º script) — trava a fonte
# sf_dataset (prefilter streaming, identidade, dedup cross-fonte, budget),
# o componente registry no ranking (lista de interesse, NÃO filtro), a
# hidratação de jobs sf_dataset (slug derivado da URL) e os defaults do CLI
# (--dataset ON no --registry, OFF no --companies; falha best-effort).
#
# DECISAO item 1 (ats-scrapers, P3 #19 desde 04/09): release PyPI 0.3.0
# (02/09/2026) contem o expose de application_deadline (PR #268). A dependencia
# e DECLARADA no pyproject ("ats-scrapers>=0.3.0") e o pip a resolve do PyPI no
# `pip install -e .` — sem instalacao manual separada (eliminou a ref de PR
# ae0ad53, so existia como refs/pull/268/head; clone + checkout falhava em
# runner limpo). O passo de verify abaixo valida o expose na versao instalada.

name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:

jobs:
  test:
    name: Suite standalone (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # Instalacao do projeto COM as dependencias declaradas no pyproject.toml
      # (fonte de verdade): o pip resolve e instala ats-scrapers>=0.3.0 (PyPI),
      # requests, pydantic, beautifulsoup4 e pycryptodome a partir do pyproject —
      # sem lista manual duplicada e sem --no-deps. O CI testa uma instalacao
      # limpa equivalente a de um usuario (Setup do README: .venv/bin/pip
      # install -e .).
      - name: Install project with declared dependencies
        run: |
          python -m pip install -e .

      # Valida o expose na versao instalada (resolvida via pyproject do PyPI).
      - name: Verify application_deadline expose in installed ats-scrapers
        run: |
          SF=$(python -c "import ats_scrapers.scrapers.successfactors as s; print(s.__file__)")
          echo "successfactors module: $SF"
          if grep -q "application_deadline" "$SF"; then
            echo "OK: application_deadline exposto no pacote instalado"
          else
            echo "ERRO: application_deadline ausente no pacote instalado"
            exit 1
          fi

      # pycryptodome e dependencia declarada do pyproject (exigencia do scraper
      # moka — Bayer, P3 #36) e chega ao ambiente SO atraves do passo de
      # instalacao acima; runner limpo nao o pre-instala. Confirma a presenca no
      # ambiente de CI (sem listas manuais — o pyproject e a fonte).
      - name: Verify pycryptodome installed (declared dependency)
        run: |
          python -c "import Crypto; print('OK: pycryptodome em', Crypto.__file__)"

      # Suite standalone. Cada script imprime [OK]/[FAIL] real no log. Exit code do
      # passo = 1 se QUALQUER teste falhar. (Com a decisao (a) do item 2, nao ha
      # dados em CI: test_dedup e test_ranking skipam o bloco real e terminam
      # "TUDO OK"; test_ranking tambem roda a FIXTURE fixa do P2 #16 — nao ha
      # allowlist de falhas conhecidas. manifest_probe.py (probe manual, sem
      # assertions) fica FORA do array: depende de rede externa (manifest do
      # ats-scrapers em storage.stapply.ai).
      - name: Run standalone test scripts
        run: |
          set +e
          # F31 (13/10): test_f31.py entra na suíte (69º script) — BME
          # JobSource: gate anti-bot SEM browser (302 Location -> echo do
          # token no cookie bot_verified), listagem Drupal server-rendered
          # + detail JSON-LD (fixtures VERBATIM do probe 13/10), Crawl-delay
          # 10s (robots) antes de CADA request, fail-soft, off-switch env,
          # ZERO HTTP — o bug do attempt 1 (redirect seguido -> pagina Bot
          # Check -> 0 vagas) fica travado no B5/F3.
          # F38 (14/10): test_f38.py entra na suíte (75º script) — freshness
          # decay: fator multiplicativo 0.5^(idade/meia-vida) por posted_at,
          # meia-vida 365d ESCOLHIDA POR BENCHMARK (grade 90/180/365d x 3
          # perfis sobre o snapshot congelado do benchmark v2; 365d = menor
          # perda de tau), MESMA fórmula nos 3 perfis (ranking/materials/eu),
          # decay opt-in via now explícito (default byte-identical — nenhum
          # call-site histórico muda), sem posted_at fator 1.0 NEUTRO (o
          # desconhecido nunca é penalizado), breakdown ganha 'decay' com a
          # contribuição aditiva (soma==score preservado), posted_at no
          # futuro = idade 0 (nunca premia bad data), sem hard cutoff
