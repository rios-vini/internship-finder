          # aceita v3 (7+decay). 100% offline, fixtures sintéticas.
          #
          # F28 (13/10): test_f28.py entra na suíte (68º script) — fit-gap de
          # skills: dicionário DE/EN versionado (grupos canônicos, sinônimos
          # contam junto), extract_skills/gap_report puros (share sobre o
          # universo), CLI de 3 seções (mercado/gaps/matches) com texto do
