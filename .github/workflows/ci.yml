# CI — Internship Finder
#
# Roda a suite standalone de scripts de teste (scripts/test_*.py) em runner
# limpo (ubuntu-latest, Python 3.12). Os testes sao scripts standalone: imprimem
# `[OK]`/`[FAIL]` e terminam com `TUDO OK` (exit 0) ou FALHAS (exit != 0).
#
# DECISAO item 2 (data/): opcao (a). Em runner limpo nao existe `data/`
# (gitignored). Os scripts test_dedup.py e test_ranking.py foram ajustados (mudanca
# minima) para SKIP o bloco "real" (data/eligible_jobs.json) quando o arquivo esta
# ausente, com mensagem clara e exit 0. Desde o P2 #16 (03/09) o test_ranking roda
# com a FIXTURE fixa (18 jobs sinteticos) no CI e NAO depende de snapshot: o
# bloco real e skipado sem `data/` e nao ha allowlist de falhas conhecidas.
#
# EXCLUSAO: scripts/test_manifest.py NAO entra na suite do CI. O manifesto das
# empresas do ats-scrapers vive fora do repo (requisicao de rede externa a
# storage.stapply.ai) — em runner limpo isso e instavel e nao-deterministico;
# o teste roda localmente (no VPS, com a base acessivel) e segue fora do CI.
#
# DECISAO item 1 (ats-scrapers, P3 #19 desde 04/09): release PyPI 0.3.0
# (02/09/2026) contem o expose de application_deadline (PR #268). Instalar
# "ats-scrapers>=0.3.0" do PyPI elimina a dependencia da ref de PR ae0ad53
# (so existia como refs/pull/268/head; clone + checkout falhava em runner
# limpo). O passo de verify abaixo valida o expose na versao instalada ANTES
# de instalar o projeto com --no-deps.

name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:

jobs:
  test:
    name: Suite standalone (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # ats-scrapers 0.3.0 (release PyPI 02/09/2026, P3 #19): instalacao direta do
      # PyPI substitui o tarball da ref de PR ae0ad53 (instavel em clone fresco) e
      # elimina o risco de instalacao fresca voltar ao 0.2.0 sem expose.
      - name: Install ats-scrapers (PyPI >=0.3.0)
        run: |
          python -m pip install "ats-scrapers>=0.3.0"

      # Dependencias do projeto + o proprio pacote. O projeto instala com
      # --no-deps (ats-scrapers ja instalado como fonte confiavel acima).
      - name: Install project deps and package (editable)
        run: |
          python -m pip install "requests>=2.31" "pydantic>=2.0" "beautifulsoup4>=4.12"
          python -m pip install -e . --no-deps

      # Valida o expose na versao instalada (agora a release 0.3.0 do PyPI).
      - name: Verify application_deadline expose in installed ats-scrapers
        run: |
          SF=$(python -c "import ats_scrapers.scrapers.successfactors as s; print(s.__file__)")
          echo "successfactors module: $SF"
          if grep -q "application_deadline" "$SF"; then
            echo "OK: application_deadline exposto no pacote instalado"
          else
            echo "ERRO: application_deadline ausente no pacote instalado"
            exit 1
          fi

      # Suite standalone. Cada script imprime [OK]/[FAIL] real no log. Exit code do
      # passo = 1 se QUALQUER teste falhar. (Com a decisao (a) do item 2, nao ha
      # dados em CI: test_dedup e test_ranking skipam o bloco real e terminam
      # "TUDO OK"; test_ranking tambem roda a FIXTURE fixa do P2 #16 — nao ha
      # allowlist de falhas conhecidas. test_manifest fica FORA do array: depende
      # de rede externa (manifest do ats-scrapers em storage.stapply.ai).
      - name: Run standalone test scripts
        run: |
          set +e
          tests=(test_filters test_hardening test_countries test_application_deadline test_dedup test_ranking test_geocoding test_sqlite test_validation test_errors test_health test_lifecycle test_registry test_fetch test_find_company test_resolver)
          status=0
          for t in "${tests[@]}"; do
            echo "==================== $t ===================="
            python "scripts/$t.py"
            rc=$?
            if [ $rc -ne 0 ]; then
              status=1
              echo "::error::$t FAILED (exit $rc)"
            else
              echo "==== $t OK ===="
            fi
            echo
          done
          if [ $status -ne 0 ]; then
            echo "::error::Uma ou mais suites falharam (ver logs acima)."
            exit 1
          fi
          echo "Todas as suites terminaram OK."