[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-finder"
version = "0.1.0"
description = "Buscador de estagios (internship / working student / Praktikum / Werkstudent) orientado a empresas, foco em Supply Chain, Procurement, BI, Analytics e Automacao (prioridade Alemanha)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # P3 #19 (04/09): release PyPI 0.3.0 (02/09/2026) contem o expose de
    # application_deadline (PR #268). Pin PyPI >=0.3.0 elimina a ref de PR
    # fragil (ae0ad53, so existia como refs/pull/268/head) e o risco de
    # instalacao fresca voltar ao 0.2.0 (sem expose). Reavaliar o range
    # quando o upstream evoluir (MASTER_PLAN P3 #30).
    "ats-scrapers>=0.3.0",
    "requests>=2.31",
    "pydantic>=2.0",
    # Scraper avature (Siemens Healthineers, DHL) do ats-scrapers exige
    # beautifulsoup4 (extra opcional); sem ele o fetch falha com ScraperError.
    "beautifulsoup4>=4.12",
]

[project.scripts]
internship-finder = "internship_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/internship_finder"]
