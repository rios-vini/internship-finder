[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-finder"
version = "0.1.0"
description = "Buscador de estagios (internship / working student / Praktikum / Werkstudent) orientado a empresas, foco em Supply Chain, Procurement, BI, Analytics e Automacao (prioridade Alemanha)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # P0 deadline: ancoragem explicita no commit upstream oficial ae0ad53
    # (contem o merge do PR #268 "expose application deadline"), porque a
    # release PyPI com esse commit ainda nao foi publicada. Trocar pelo pin
    # PyPI assim que existir.
    "ats-scrapers @ git+https://github.com/kalil0321/ats-scrapers@ae0ad53",
    "requests>=2.31",
    "pydantic>=2.0",
    # Scraper avature (Siemens Healthineers, DHL) do ats-scrapers exige
    # beautifulsoup4 (extra opcional); sem ele o fetch falha com ScraperError.
    "beautifulsoup4>=4.12",
]

[project.scripts]
internship-finder = "internship_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/internship_finder"]

[tool.hatch.metadata]
# Necessario para a dependencia direta por commit git (pin provisorio ae0ad53)
# ate existir release PyPI com o merge do PR #268.
allow-direct-references = true
