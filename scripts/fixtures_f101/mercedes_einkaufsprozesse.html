    "description": "Einleitung&lt;br&gt;&lt;div&gt;&lt;p&gt;Life is always about becoming… Im Leben geht es darum, sich auf eine Reise zu begeben, um die beste Version unseres zukünftigen Selbst zu werden. Während wir Neues entdecken, stellen wir uns Herausforderungen, meistern sie und wachsen über uns hinaus.&lt;br&gt;Bewerben Sie sich bei Mercedes-Benz und finden Sie den Aufgabenbereich, in dem Sie Ihre Talente individuell entfalten können. Dabei werden Sie von visionären Kolleginnen und Kollegen unterstützt, die Ihren Pioniergeist teilen. Bei uns einzusteigen bedeutet, Teil eines globalen Teams zu werden, dessen Ziel es ist, die begehrenswertesten Automobile der Welt zu bauen. Together for excellence.&lt;br&gt;Stellennummer: MER000465B&lt;br&gt;&lt;/p&gt;&lt;p&gt;Die Mercedes-Benz Group AG ist eines der erfolgreichsten Automobilunternehmen der Welt. Mit der Mercedes-Benz AG gehört der Fahrzeughersteller zu den größten Anbietern von Premium- und Luxus-Pkw und Vans.&lt;/p&gt;&lt;p&gt;Du möchtest verstehen, wie die Prozesse und Systeme hinter dem Einkauf eines globalen Automobilherstellers entstehen und weiterentwickelt werden? Dann bist du bei uns genau richtig.&lt;/p&gt;&lt;p&gt;In unserem Team gestaltest du die Zukunft des Produktionsmaterial-Einkaufs von Mercedes-Benz aktiv mit. Gemeinsam entwickeln wir Einkaufsprozesse und -systeme weiter, begleiten Governance-Themen und sorgen dafür, dass Veränderungen erfolgreich in der Organisation verankert werden. Dabei arbeitest du an der Schnittstelle von Prozessmanagement, Systemen, Kommunikation und Managementgremien sowie erhältst spannende Einblicke in zentrale Steuerungs- und Entscheidungsprozesse des Einkaufs.&lt;/p&gt;&lt;p&gt;Diese Herausforderungen kommen u. a. auf Dich zu:&lt;/p&gt;&lt;ul&gt; &lt;li&gt;Gestalte gemeinsam mit uns die Weiterentwicklung von Einkaufsprozessen, Vergabesystemen und Governance-Themen&lt;/li&gt;&lt;li&gt;Unterstütze bei der Analyse, Modellierung und Optimierung von Prozessen und Systemlandschaften in SAP Signavio&lt;/li&gt;&lt;li&gt;Gewinne Einblicke in die Steuerung von Werkzeug- und Vergabeprozessen innerhalb eines globalen Einkaufs&lt;/li&gt;&lt;li&gt;Arbeite an der Vor- und Nachbereitung von Prozessgremien und bereite Entscheidungsgrundlagen auf&lt;/li&gt;&lt;li&gt;Erstelle Management-Präsentationen, Analysen und Kommunikationsunterlagen für unterschiedliche Zielgruppen&lt;/li&gt;&lt;li&gt;Gestalte moderne Kommunikations- und Informationsmedien (z.B. Präsentationen, Intranet-Beiträge, Leitfäden oder Kommunikationskampagnen) für die Wissensvermittlung&lt;/li&gt;&lt;li&gt;Nutze moderne KI-Anwendungen zur Bearbeitung von Prozess-, Kommunikations- und Governance-Themen&lt;/li&gt;&lt;li&gt;Übernimm eigene Themenpakete und präsentiere deine Ergebnisse vor dem Team oder dem Fachbereich&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Die Tätigkeit kann ab Februar 2027 beginnen. &lt;/p&gt;&lt;br&gt;&lt;ul&gt; &lt;li&gt;Studiengang Wirtschaftswissenschaften, BWL, Medien- oder Kommunikationsmanagement oder einen vergleichbaren Studiengang&lt;/li&gt;&lt;li&gt;Sichere Deutsch- und Englischkenntnisse in Wort und Schrift&lt;/li&gt;&lt;li&gt;Sicherer Umgang mit MS-Office, insbesondere PowerPoint &amp; Excel&lt;/li&gt;&lt;li&gt;Erfahrung in der Erstellung von Präsentationen, Visualisierungen oder Kommunikationsmaterialien von Vorteil&lt;/li&gt;&lt;li&gt;Vorkenntnisse in der Prozessmodellierung wünschenswert&lt;/li&gt;&lt;li&gt;Interesse an der visuellen Aufbereitung von Inhalten sowie an der Gestaltung moderner Kommunikations- und Medienformate&lt;/li&gt;&lt;li&gt;Engagement, Zuverlässigkeit und Teamfähigkeit&lt;/li&gt;&lt;li&gt;Analytische Denkweise und strategische Arbeitsweise&lt;/li&gt;&lt;li&gt;Kommunikations- und Präsentationsfähigkeit&lt;/li&gt;&lt;li&gt;&lt;p&gt;Begeisterungsfähigkeit für neue Themen und Technologien&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Zusätzliche Informationen:&lt;/p&gt;&lt;p&gt;Wir freuen uns auf Deine Online-Bewerbung mit Lebenslauf, Anschreiben, Zeugnissen, aktueller Immatrikulationsbescheinigung mit Angabe des Fachsemesters, ggf. Pflichtpraktikumsnachweis und Nachweis über die Regelstudienzeit. Bitte vergiss nicht im Online-Formular Deine Dokumente als \&quot;relevant für diese Bewerbung\&quot; zu markieren und beachten die maximale Dateigröße von 5 MB.&lt;/p&gt;&lt;p&gt;Weiterführende Informationen zu den Einstellkriterien findest Du hier.&lt;/p&gt;&lt;p&gt;Schwerbehinderte und gleichgestellte Bewerbende sind herzlich willkommen! Die Schwerbehindertenvertretung () unterstützt Dich gerne im Bewerbungsprozess.&lt;/p&gt;&lt;p&gt;People Solutions hilft Dir bei Fragen zum Bewerbungsprozess gerne weiter. Du erreichst uns per E-Mail über  oder telefonisch unter 0711/17-99000 (Mo-Fr 10-12 Uhr &amp; 13-15 Uhr).&lt;/p&gt;&lt;br&gt;&lt;ul&gt;&lt;li&gt;       Essenszulagen      &lt;/li&gt;&lt;li&gt;       Mitarbeiterhandy möglich      &lt;/li&gt;&lt;li&gt;       Mitarbeiterrabatte möglich      &lt;/li&gt;&lt;li&gt;       Mitarbeiterbeteiligung möglich      &lt;/li&gt;&lt;li&gt;       Mitarbeiter Events      &lt;/li&gt;&lt;li&gt;       Coaching      &lt;/li&gt;&lt;li&gt;       Flexible Arbeitszeit möglich      &lt;/li&gt;&lt;li&gt;       Hybrides Arbeiten möglich      &lt;/li&gt;&lt;li&gt;       Gesundheitsmaßnahmen      &lt;/li&gt;&lt;li&gt;       Betriebliche Altersversorgung      &lt;/li&gt;&lt;li&gt;       Mobilitätsangebote      &lt;/li&gt;&lt;li&gt;       Parkplatz      &lt;/li&gt;&lt;li&gt;       Betriebsarzt      &lt;/li&gt;&lt;li&gt;       Gute Anbindung      &lt;/li&gt;&lt;li&gt;       Barrierefreiheit      &lt;/li&gt;&lt;li&gt;       Kinderbetreuung      &lt;/li&gt;&lt;li&gt;       Kantine, Café      &lt;/li&gt;&lt;/ul&gt;&lt;br&gt;&lt;p&gt;JBRP2_DE&lt;/p&gt;&lt;/div&gt;&lt;br&gt;Aufgaben&lt;br&gt;",
