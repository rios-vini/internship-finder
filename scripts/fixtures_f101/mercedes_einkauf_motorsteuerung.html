    "description": "Einleitung&lt;br&gt;&lt;div&gt;&lt;p&gt;Life is always about becoming… Im Leben geht es darum, sich auf eine Reise zu begeben, um die beste Version unseres zukünftigen Selbst zu werden. Während wir Neues entdecken, stellen wir uns Herausforderungen, meistern sie und wachsen über uns hinaus.&lt;br&gt;Bewerben Sie sich bei Mercedes-Benz und finden Sie den Aufgabenbereich, in dem Sie Ihre Talente individuell entfalten können. Dabei werden Sie von visionären Kolleginnen und Kollegen unterstützt, die Ihren Pioniergeist teilen. Bei uns einzusteigen bedeutet, Teil eines globalen Teams zu werden, dessen Ziel es ist, die begehrenswertesten Automobile der Welt zu bauen. Together for excellence.&lt;br&gt;Stellennummer: MER00048MT&lt;br&gt;&lt;/p&gt;&lt;p&gt;Der Bereich Procurement and Supplier Quality Mercedes-Benz Cars and Vans - Powertrain ist für den Moduleinkauf und die Lieferantenqualität aller Powertrain-Komponenten sowie für das Projektmanagement für neue Motoren und Getriebeprojekte von Mercedes-Benz Cars und Vans verantwortlich. Insbesondere der Wandel zur Elektromobilität stellt den Bereich vor zahlreiche und spannende Herausforderungen. Du arbeitest operativ im Team und sammelst Erfahrungen im gesamten Vergabeprozess sowie in der Erstellung von Einkaufsabschlüssen und Bestellungen unter Einhaltung der relevanten MBAG-Richtlinien und -Prozesse für die Beschaffung. Die Teilnahme an internationalen Lieferantenterminen und -Verhandlungen gehört genauso dazu wie die Erstellung und Vorstellung von Briefing- und Entscheidungsunterlagen in den Modulteams und Entscheidungsgremien&lt;/p&gt;&lt;p&gt;Diese Herausforderungen kommen u. a. Dich zu:&lt;/p&gt;&lt;ul&gt; &lt;li&gt;&lt;p&gt;Beschaffungsmarktanalysen und Benchmark-Aktivitäten Ausarbeitung und Umsetzung von globalen Beschaffungs- und Transformationsstrategien &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Marktanfragen und Verhandlungen mit Lieferanten gem. der Vergabeprozesse Erstellung von Angebotsvergleichen und Vorbereitung von Entscheidungsvorlagen &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Vorbereitung, Durchführung und Auswertung von internationalen Lieferantenterminen, u. a. Verhandlungen und Workshops (auch bei Lieferanten vor Ort) &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Mitarbeit bei aktuellen Projekten, der Steuerung des Änderungsmanagements sowie beim Tracking des Vertragsmanagements Unterstützung bei der Abstimmung des Einkaufs mit angrenzenden Fachbereichen (Strategie, Entwicklung, Qualität, Logistik, Produktion) und mit den Lieferanten&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Das Tätigkeit kann ab Februar 2027 beginnen. &lt;/p&gt;&lt;br&gt;&lt;ul&gt; &lt;li&gt;&lt;p&gt;Studiengang im Bereich (Wirtschafts-)Ingenieurwesen, Wirtschaftswissenschaften, BWL oder ein vergleichbarer Studiengang &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Sichere Deutsch- und Englischkenntnisse in Wort und Schrift &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Sicherer Umgang mit MS-Office, insbesondere Excel und Powerpoint &lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Analytische Denkweise Kommunikations- und Organisationsfähigkeit&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Strategische Arbeitsweise Teamfähigkeit, Motivation und Zuverlässigkeit&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Bitte beachte, dass Dein Praktikum an diesem Standort einen vorgeschriebenen Pflichtanteil aufweisen muss.&lt;/p&gt;&lt;p&gt;Zusätzliche Informationen:&lt;/p&gt;&lt;p&gt;Wir freuen uns auf Deine Online-Bewerbung mit Lebenslauf, Anschreiben, Zeugnissen, aktueller Immatrikulationsbescheinigung mit Angabe des Fachsemesters, ggf. Pflichtpraktikumsnachweis und Nachweis über die Regelstudienzeit. Bitte vergiss nicht im Online-Formular Deine Dokumente als \&quot;relevant für diese Bewerbung\&quot; zu markieren und beachte die maximale Dateigröße von 5 MB.&lt;/p&gt;&lt;p&gt;Weiterführende Informationen zu den Einstellkriterien findest Du hier.&lt;/p&gt;&lt;p&gt;Schwerbehinderte und gleichgestellte Bewerbende sind herzlich willkomm
